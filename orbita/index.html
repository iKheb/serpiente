<meta name="theme-color" content="#05060d">
<meta name="color-scheme" content="dark">
<meta name="description" content="Órbita — televisión en vivo, películas y series en un solo universo. Navegador, móvil, tablet y Smart TV.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Órbita TV</title>
<link rel="preload" href="fonts/outfit-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">

<script type="importmap">
{ "imports": {
  "three": "./vendor/three/three.module.js",
  "three/addons/": "./vendor/three/addons/",
  "cannon-es": "./vendor/cannon/cannon-es.js"
} }
</script>
</head>
<body>
  <!-- Capa de fondo 3D persistente (hero / ambiente) -->
  <div id="stage" aria-hidden="true"></div>
  <!-- Aplicación -->
  <div id="app" role="application" aria-label="Órbita">
    <header id="shell-top"></header>
    <nav id="shell-nav" aria-label="Navegación principal"></nav>
    <main id="view" tabindex="-1"></main>
  </div>
  <!-- Capas superpuestas: detalle, reproductor, búsqueda, etc. -->
  <div id="overlays"></div>
  <!-- Intro -->
  <div id="splash" aria-hidden="true"></div>
  <!-- Notificaciones -->
  <div id="toasts" role="status" aria-live="polite"></div>
  <noscript><p style="color:#fff;padding:2rem;font-family:sans-serif">Órbita necesita JavaScript activado.</p></noscript>
  <script type="module" src="js/main.js"></script>

</html>
